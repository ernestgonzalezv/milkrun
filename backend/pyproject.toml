[project]
name = "milkrun-backend"
version = "0.1.0"
description = "Planificacion y seguimiento de rutas de reparto"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "DJ"]
ignore = ["RUF001", "RUF002", "RUF003"]  # el codigo esta comentado en espanol

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "N806", "RUF012"]
# Meta.constraints / Meta.indexes son listas por contrato del ORM de Django;
# RUF012 las marca como estado mutable compartido y ahi no aplica.
"*/models.py" = ["RUF012"]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# ortools (dependencia de desarrollo, solo para el benchmark) arrastra bindings
# SWIG que avisan en cada import. Es ruido de una libreria de terceros y tapa
# el resumen de la corrida.
filterwarnings = [
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["domain", "optimizer", "infrastructure", "apps", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "config/wsgi.py",
    "config/asgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "class .*\\(Protocol\\):",
]
