        required: true
      tags:
      - Fleet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDriverProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDriverProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDriverProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
          description: ''
    get:
      operationId: v1_drivers_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this driver.
        required: true
      tags:
      - Fleet
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
          description: ''
    put:
      operationId: v1_drivers_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this driver.
        required: true
      tags:
      - Fleet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DriverProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DriverProfileRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
          description: ''
    delete:
      operationId: v1_drivers_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this driver.
        required: true
      tags:
      - Fleet
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    DeliveryEventRequest:
      type: object
      properties:
        stop:
          type: integer
        client_event_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/KindEnum'
        reason:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/ReasonEnum'
          - $ref: '#/components/schemas/BlankEnum'
        note:
          type: string
          default: ''
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        occurred_at:
          type: string
          format: date-time
      required:
      - client_event_id
      - kind
      - occurred_at
      - stop
    Depot:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        address:
          type: string
          maxLength: 255
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        is_active:
          type: boolean
          title: Active
      required:
      - id
      - latitude
      - longitude
      - name
    DepotRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          maxLength: 255
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        is_active:
          type: boolean
          title: Active
      required:
      - latitude
      - longitude
      - name
    DriverProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        username:
          type: string
