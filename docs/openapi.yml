      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this vehicle.
        required: true
      tags:
      - Fleet
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/drivers/:
    post:
      operationId: v1_drivers_create
      tags:
      - Fleet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DriverProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DriverProfileRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
          description: ''
    get:
      operationId: v1_drivers_list
      parameters:
      - in: query
        name: depot
        schema:
          type: integer
      - in: query
        name: is_available
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - Fleet
      security:
      - jwtAuth: []
