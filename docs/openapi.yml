tags:
- name: Authentication
  description: JWT tokens and the signed-in user. Everything else requires them.
- name: Planning
  description: The core. `routes/plan/` runs the VRP solver and persists the day's
    plan; the rest reads back what it produced.
- name: Deliveries
  description: 'Creating and reading stops: the orders to be delivered.'
- name: Driver app
  description: 'What the Android app consumes, including the offline queue sync. That
    sync is idempotent: resending the same batch duplicates nothing.'
- name: Public tracking
  description: No authentication. This is the link the end customer receives, rate
    limited per IP and with personal data trimmed.
- name: Fleet
  description: 'Reference catalogues: depots, vehicles and drivers.'
