openapi: 3.0.3
info:
  title: milkrun API
  version: 1.0.0
  description: Delivery route planning and live tracking.
paths:
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: Returns `access` (8 h, one shift) and `refresh` (30 days).
      summary: Obtain the token pair
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: 'The refresh token rotates on every use: the previous one stops
        working.'
      summary: Refresh the access token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/token/verify/:
    post:
      operationId: v1_auth_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      summary: Check whether a token is still valid
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: La app movil y el dashboard la llaman al arrancar para saber el
        rol.
      summary: The signed-in user
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/stops/:
    get:
      operationId: v1_stops_list
      description: Listado y alta de paradas.
      tags:
      - Deliveries
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Stop'
          description: ''
    post:
      operationId: v1_stops_create
      description: Listado y alta de paradas.
      tags:
      - Deliveries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StopRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StopRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stop'
          description: ''
  /api/v1/stops/{id}/:
    get:
      operationId: v1_stops_retrieve
      description: Consulta, edicion y baja de una parada.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Deliveries
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stop'
          description: ''
    put:
      operationId: v1_stops_update
      description: Consulta, edicion y baja de una parada.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Deliveries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StopRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StopRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stop'
          description: ''
    patch:
      operationId: v1_stops_partial_update
      description: Consulta, edicion y baja de una parada.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Deliveries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStopRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStopRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStopRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stop'
          description: ''
    delete:
      operationId: v1_stops_destroy
      description: Consulta, edicion y baja de una parada.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Deliveries
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Stop deleted
  /api/v1/routes/plan/:
    post:
      operationId: v1_routes_plan_create
      description: Dispara el optimizador y persiste el plan resultante.
      summary: Plan a depot's routes for one day
      tags:
      - Planning
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlanRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlanRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Route'
          description: ''
        '409':
          description: A plan already exists and no re-plan was requested
  /api/v1/routes/:
    get:
      operationId: v1_routes_list
      description: 'Consulta de rutas planificadas. Solo lectura: se crean planificando.'
      parameters:
      - in: query
        name: expand
        schema:
          type: string
          enum:
          - stops
        description: With `expand=stops` the list includes each route's stops. The
          dashboard map uses it, because it needs the whole day in one request. The
          default listing stays light.
      tags:
      - Planning
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RouteSummary'
          description: ''
  /api/v1/routes/{id}/:
    get:
      operationId: v1_routes_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Planning
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
          description: ''
  /api/v1/me/route/:
    get:
      operationId: v1_me_route_retrieve
      description: Returns 204 when the driver has no route assigned for that date.
      summary: The signed-in driver's route for the day
      tags:
      - Driver app
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
          description: ''
        '204':
          description: No route assigned
  /api/v1/me/events/:
    post:
      operationId: v1_me_events_create
      description: 'Idempotent on `client_event_id`. Resending the same batch duplicates
        nothing: events already seen are reported under `duplicates` and the response
        stays 200, so the app can clear its queue without ambiguity.'
      summary: Sync the driver event queue
      tags:
      - Driver app
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatchRequest'
            examples:
              ADeliveryAndAFailureInOneBatch:
                value:
                  events:
                  - stop: 12
                    client_event_id: 6f1a5c1e-8f0b-4a5e-9d33-2f2f0f6a1b01
                    kind: delivered
                    occurred_at: '2026-09-12T14:02:11Z'
                  - stop: 13
                    client_event_id: 6f1a5c1e-8f0b-4a5e-9d33-2f2f0f6a1b02
                    kind: failed
                    reason: absent
                    note: Knocked three times, nobody answered
                    occurred_at: '2026-09-12T14:31:47Z'
                summary: A delivery and a failure in one batch
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventBatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventBatchRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Summary of what the sync stored
  /api/v1/me/pings/:
    post:
      operationId: v1_me_pings_create
      summary: Upload buffered GPS positions
      tags:
      - Driver app
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PingBatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PingBatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PingBatchRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          description: Number of new positions stored
  /api/v1/track/{code}/:
    get:
      operationId: v1_track_retrieve
      description: No authentication. Limited to 60 requests per minute per IP.
      summary: Public tracking for one shipment
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - Public tracking
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTracking'
          description: ''
  /api/v1/depots/:
    post:
      operationId: v1_depots_create
      tags:
      - Fleet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepotRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DepotRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepotRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Depot'
          description: ''
    get:
      operationId: v1_depots_list
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - Fleet
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDepotList'
          description: ''
  /api/v1/depots/{id}/:
    patch:
      operationId: v1_depots_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this depot.
        required: true
      tags:
      - Fleet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDepotRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDepotRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDepotRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Depot'
          description: ''
    get:
      operationId: v1_depots_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this depot.
        required: true
      tags:
      - Fleet
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Depot'
          description: ''
    put:
      operationId: v1_depots_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this depot.
        required: true
      tags:
      - Fleet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepotRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DepotRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepotRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Depot'
          description: ''
    delete:
      operationId: v1_depots_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this depot.
        required: true
      tags:
      - Fleet
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/vehicles/:
    post:
      operationId: v1_vehicles_create
      tags:
      - Fleet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
          description: ''
    get:
      operationId: v1_vehicles_list
      parameters:
      - in: query
        name: depot
        schema:
          type: integer
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - Fleet
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVehicleList'
          description: ''
  /api/v1/vehicles/{id}/:
    patch:
      operationId: v1_vehicles_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this vehicle.
        required: true
      tags:
      - Fleet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVehicleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVehicleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVehicleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
          description: ''
    get:
      operationId: v1_vehicles_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this vehicle.
        required: true
      tags:
      - Fleet
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
          description: ''
    put:
      operationId: v1_vehicles_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this vehicle.
        required: true
      tags:
      - Fleet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
          application/x-www-form-urlencoded:
            schema:
