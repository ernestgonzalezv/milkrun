# Detekt 2.0 para milkrun Android.
# Solo overrides sobre la configuracion por defecto (buildUponDefaultConfig = true).
# Mantiene las mismas reglas que Cococel.Android para que el codigo sea portable.

config:
  warningsAsErrors: false

complexity:
  LargeClass:
    excludes: ['**/test/**', '**/androidTest/**']
  LongParameterList:
    ignoreDefaultParameters: true
  # Un *Api agrupa los endpoints de un concepto del backend (ver rules/ktor/conventions.md).
  # Partirlo para cumplir el limite por defecto violaria esa regla.
  TooManyFunctions:
    allowedFunctionsPerClass: 16

coroutines:
  active: true

empty-blocks:
  active: true

exceptions:
  active: true
  TooGenericExceptionThrown:
    excludes: ['**/test/**', '**/androidTest/**']
  TooGenericExceptionCaught:
    exceptionNames:
      - 'ArrayIndexOutOfBoundsException'
      - 'Error'
      - 'IllegalMonitorStateException'
      - 'IndexOutOfBoundsException'
      - 'NullPointerException'

naming:
  active: true
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

performance:
  active: true

potential-bugs:
  active: true

style:
  active: true
  ForbiddenComment:
    active: false
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true
  NewLineAtEndOfFile:
    active: false
  ReturnCount:
    max: 3
  TrailingWhitespace:
    active: false
  UnusedImport:
    active: false
  WildcardImport:
    excludeImports:
      - 'java.util.*'
      - 'kotlinx.coroutines.flow.*'
