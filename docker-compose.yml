# Entorno completo para desarrollo: base de datos, API y dashboard.
#
#   docker compose up --build
#   docker compose exec api python manage.py seed_demo
#
# La app Android no va aqui: se compila con Gradle y apunta a 10.0.2.2:8000,
# que es como el emulador ve el localhost de la maquina anfitriona.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: milkrun
      POSTGRES_USER: milkrun
      POSTGRES_PASSWORD: milkrun
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # La API no arranca hasta que Postgres acepta conexiones de verdad,
      # no solo hasta que el contenedor esta "up".
      test: ["CMD-SHELL", "pg_isready -U milkrun"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgres://milkrun:milkrun@db:5432/milkrun
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,10.0.2.2,api
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
